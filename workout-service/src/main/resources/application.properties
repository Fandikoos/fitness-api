spring.application.name=workout-service

# --- Datasource ---
# Conexión a MySQL. Cada microservicio apunta a su propio schema (workout_db).
# Las credenciales se inyectan por variables de entorno para no versionar secrets.
spring.datasource.url=jdbc:mysql://localhost:3307/workout_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update: Hibernate ajusta el schema automáticamente según las entidades (crea tablas, añade columnas).
# Útil en desarrollo. En producción se usa "validate" + migraciones con Flyway o Liquibase.
spring.jpa.hibernate.ddl-auto=update
# Muestra las queries SQL generadas por Hibernate en consola — muy útil para aprender y debuggear.
spring.jpa.show-sql=true
# Formatea el SQL en varias líneas para que sea más legible.
spring.jpa.properties.hibernate.format_sql=true
# Fuerza el dialecto de MySQL 8 para que Hibernate genere SQL optimizado para esta versión.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
