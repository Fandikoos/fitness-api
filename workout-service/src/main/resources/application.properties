spring.application.name=workout-service

# --- Datasource ---
# Conexión a MySQL. Cada microservicio apunta a su propio schema (workout_db).
# Las credenciales se inyectan por variables de entorno para no versionar secrets.
spring.datasource.url=jdbc:mysql://localhost:3307/workout_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: Hibernate valida que el schema de la base de datos coincida con las entidades JPA. Si no coincide, lanza un error y no arranca la app.
spring.jpa.hibernate.ddl-auto=validate
# Muestra las queries SQL generadas por Hibernate en consola — muy útil para aprender y debuggear.
spring.jpa.show-sql=true
# Formatea el SQL en varias líneas para que sea más legible.
spring.jpa.properties.hibernate.format_sql=true
# Fuerza el dialecto de MySQL 8 para que Hibernate genere SQL optimizado para esta versión.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuracion Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration