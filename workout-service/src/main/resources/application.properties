spring.application.name=workout-service

# --- Datasource ---
# Conexión a MySQL. Cada microservicio apunta a su propio schema (workout_db).
# Las credenciales se inyectan por variables de entorno para no versionar secrets.
spring.datasource.url=jdbc:mysql://localhost:3307/workout_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: Hibernate valida que el schema de la base de datos coincida con las entidades JPA. Si no coincide, lanza un error y no arranca la app.
spring.jpa.hibernate.ddl-auto=validate
# Muestra las queries SQL generadas por Hibernate en consola — muy útil para aprender y debuggear.
spring.jpa.show-sql=true
# Formatea el SQL en varias líneas para que sea más legible.
spring.jpa.properties.hibernate.format_sql=true
# Fuerza el dialecto de MySQL 8 para que Hibernate genere SQL optimizado para esta versión.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuracion Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Optimización de queries N+1 ---
# Sin esto, Hibernate lanza una query por cada colección LAZY que accede (N+1 problem).
# Con batch_fetch_size=16, agrupa las cargas en un IN (?, ?, ...) de hasta 16 IDs.
# Ejemplo: en vez de 5 queries "WHERE program_id = ?" lanza 1 "WHERE program_id IN (1,2,3,4,5)".
# No cambia el modelo ni el contrato de la API — solo cómo Hibernate ejecuta las cargas LAZY.
# Lo suyo seria hacer un refactor para eliminar las one to many, esto es un parche temporal para mejorar el rendimiento.
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# --- Medición de queries (activar para diagnóstico, desactivar en producción) ---
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=debug
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=debug