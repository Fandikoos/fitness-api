# --- Datasource (desarrollo local) ---
# En local apuntamos a MySQL corriendo en Docker en el puerto 3307.
# Las credenciales se pasan por variable de entorno para no versionar secrets
# (ej: DB_USERNAME=root DB_PASSWORD=admin ./mvnw spring-boot:run).
spring.datasource.url=jdbc:mysql://localhost:3307/workout_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CORS (desarrollo local) ---
# El frontend Angular corre en localhost:4200 en desarrollo.
# Esta propiedad la lee CorsProperties (@ConfigurationProperties) y la inyecta en CorsConfig.
app.cors.allowed-origins=http://localhost:4200

# Muestra las queries SQL generadas por Hibernate en consola — muy útil para aprender y debuggear.
spring.jpa.show-sql=true
# Formatea el SQL en varias líneas para que sea más legible.
spring.jpa.properties.hibernate.format_sql=true

# --- Medición de queries (activar para diagnóstico, desactivar en producción) ---
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=debug
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=debug
