# --- Datasource (producción / Docker) ---
# En el contenedor, la BD no está en localhost sino en el host "mysql"
# (nombre del servicio definido en compose.yaml). La URL y credenciales
# las inyecta Docker Compose como variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- CORS (producción) ---
# El origen permitido se configura por variable de entorno (ej: https://mi-app.com).
# Esta propiedad la lee CorsProperties (@ConfigurationProperties) y la inyecta en CorsConfig.
app.cors.allowed-origins=${CORS_ORIGIN}
